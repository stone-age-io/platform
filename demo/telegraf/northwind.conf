# =============================================================================
# Northwind Traders — NATS telemetry -> VictoriaMetrics
# =============================================================================
# Telegraf subscribes to the subjects `demo/rules/northwind/telemetry.yaml`
# publishes, turns each JSON payload into a time series, and writes it to
# VictoriaMetrics over InfluxDB line protocol. Grafana or Perses then reads it
# back with PromQL/MetricsQL.
#
# VictoriaMetrics is LONG-TERM STORAGE here and nothing else. It holds history
# for charts, comparison and reporting. It does not decide anything: thresholds
# and alarms belong on the bus, in rule-router, at the edge, where they still
# work with the WAN down. Do not put an alert path in front of this.
#
# Nothing here ships in the binary. It is demo tooling, like the rules files.
#
# ONE PROCESS PER ORGANIZATION, for the same reason rule-router is one process
# per organization: in NATS operator mode the ACCOUNT is the tenant boundary,
# and a connection authenticated into Northwind cannot see Ironbridge's traffic.
# Copy this file per org, change `org` in [global_tags] and the creds path.
#
# ONE INPUT, ONE CONNECTION — THIS IS NOT A STYLE CHOICE.
# Every [[inputs.nats_consumer]] opens its OWN NATS connection. This file used
# to have one input per thing-type operation, which read beautifully and asked
# for six connections to carry eleven subscriptions. The platform's default
# account limit is `nats.default_limits.max_connections: 10` (config.yaml), and
# the Northwind demo account is already carrying rule-router, four
# access-controllers and accessd — so it failed on startup with
#
#   nats: maximum account active connections exceeded
#
# and it would have eaten a real tenant's entire connection budget. A NATS
# connection multiplexes any number of subscriptions; use one, list the subjects,
# and let the processors sort out what each message is. If you add subjects, add
# them to the list below — do NOT add a second input.
#
# THE CREDENTIAL SHOULD BE READ-ONLY. rule-router needs `console-operator`
# because it publishes. Telegraf only subscribes, so it wants `console-readonly`
# — seeded on the `audit@northwind.example` (viewer) membership as the NATS user
# `console-audit`. Sign in as the org owner, NATS → Users → console-audit →
# Download credentials. A metrics collector holding publish `>` is a metrics
# collector that can drive the Publisher widget.
#
# ONE MEASUREMENT, AND THE FIELD NAMES CARRY THE MEANING. Everything lands as
# `thing`, so VictoriaMetrics names the series `thing_<field>`:
# `thing_celsius`, `thing_percent`, `thing_uptime`, `thing_duration`,
# `thing_lines`. Every field name in this org's contracts is already distinct, so
# an operation tag would only repeat what the field says — `thing_duration`
# exists on door events and nowhere else, so `count_over_time(thing_duration[5m])`
# IS the door event rate.
#
# WHAT IS DELIBERATELY NOT COLLECTED
#   - `asset.*.*.setpoint.echo` — an echo is an ASSERTION, not a measurement. It
#     never moves, so as a series it is a flat line that costs storage and says
#     nothing the Digital Twin screen does not say better.
#   - `display.KC-DC1.DISP-KC-01.render` — that is a screen's contents, not a
#     reading.
#   - `*.diag` — request/reply. There is no feed to subscribe to; a reply goes to
#     the requester's inbox.
#   - `$KV.twin.>` — reported state is already durable in a KV bucket with
#     history. Copying it into a TSDB gives you the same numbers plus a second
#     source of truth to keep in step.
# That is 12 of the 44 subjects the rules file publishes; the other 32 are below.
#
# CARDINALITY: TAG WHAT YOU GROUP BY, NOTHING ELSE. `location`, `thing`,
# `state`, `version` are bounded by the inventory. An order number and a trace
# id are not — one series per order, forever — so they stay out. The rule that
# keeps this honest: a tag answers a question asked ACROSS records ("which site
# is warm"). A value you only ever read back on one record belongs in the event
# log, not in a label.
#
# LET VICTORIAMETRICS SCRAPE THE PROMETHEUS ENDPOINTS ITSELF. The Control Plane
# already serves `/metrics` (`stone_age_*`) and so does leaf-sync
# (`leaf_sync_*`). Point VictoriaMetrics' own `-promscrape.config` at those.
# Telegraf's job here is the half with no Prometheus exposition: JSON on the
# bus. Running Prometheus metrics through influx line protocol mangles
# histograms for no gain.
#
# RUN IT
#   victoria-metrics -storageDataPath=./vmdata -retentionPeriod=30d
#   telegraf --config demo/telegraf/northwind.conf
#   # Grafana: add a Prometheus datasource pointing at http://localhost:8428
#
# On Windows use TOML single quotes for paths — 'C:\stone\console-audit.creds' —
# or forward slashes. A backslash inside a double-quoted TOML string is an escape
# sequence, the same trap the rules README calls out for YAML.
# =============================================================================

[agent]
  interval = "10s"           # unused: nats_consumer is a service input, not polled
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  # The Telegraf box is not the device. A `host` tag here would label every
  # reading in the estate with the name of the machine collecting it.
  omit_hostname = true

[global_tags]
  # The org is a LABEL, not part of the metric name — one dashboard then serves
  # every tenant with a variable. Note this is the opposite call from the
  # Control Plane's own /metrics, which carries no org label on purpose: that
  # endpoint is open by default and its series are inventory counts, where a
  # tenant name is a customer list. Here the collector is already inside one
  # tenant's account and cannot see another's.
  #
  # If those tenants must not share a TSDB at all, do not solve it with labels:
  # VictoriaMetrics cluster has real multitenancy and its tenant id maps 1:1
  # onto the NATS account. Point the output at
  # http://<vminsert>:8480/insert/<tenant>/influx and drop this tag.
  org = "northwind"

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------
# VictoriaMetrics accepts InfluxDB line protocol and turns
# `measurement,tags field=value` into `measurement_field{tags}`. So the
# measurement name plus the JSON field name IS the metric name:
# `thing` + `celsius` -> thing_celsius{org,location,thing}
#
# `outputs.http`, NOT `outputs.influxdb`, deliberately. The influxdb output always
# appends `db=<database>` to the write URL, and VictoriaMetrics turns that
# parameter into a `db="telegraf"` label on EVERY series — a constant carrying no
# information, in every Grafana legend forever. VictoriaMetrics has no databases;
# posting line protocol to /influx/write says so, and drops both `database` and
# `skip_database_creation` from this file at the same time.
[[outputs.http]]
  url = "http://localhost:8428/influx/write"
  data_format = "influx"
  content_encoding = "gzip"
  # A 400 from VictoriaMetrics means a malformed batch. Retrying it forever just
  # blocks the queue behind a body that will never be accepted.
  non_retryable_statuscodes = [400]
  # `subject` has done its job in the processors below and is now a redundant
  # high-cardinality copy of location + thing + operation. Dropping it at the
  # output keeps it available to every processor and out of storage.
  tagexclude = ["subject"]

# =============================================================================
# INPUT — one connection, every subject
# =============================================================================
# The subjects are wildcards, not literal codes: an operation is a thing-type
# contract, so every probe of that type has the same payload shape. Seed an
# eleventh probe and it appears in Grafana with no edit here.
#
# The payload shapes differ between operations and that is fine. The JSON parser
# takes every number it finds as a field, and `tag_keys` promotes a key only
# where the payload has one — a door event has no `version`, so it simply gets no
# `version` tag. One parser genuinely does serve all eleven subjects.
#
# TIMESTAMPS: rule-router emits `{@timestamp.iso}` as Go's time.RFC3339, second
# granularity, which `json_time_format = "RFC3339"` parses exactly. Using the
# payload's own time rather than arrival time is safe here because each subject
# carries one sample per cron tick — two samples can never land on the same
# timestamp for the same series. That is NOT true of the access-control events;
# see that repo's config for why it makes the opposite choice.
#
# Every subject below carries a `ts`. The three that do not (`.setpoint` and the
# two `.setpoint.echo`) are matched by none of these patterns, which is what
# keeps `json_time_key` from failing on them.
[[inputs.nats_consumer]]
  name_override = "thing"
  servers = ["nats://localhost:4222"]
  credentials = "/path/to/console-audit.creds"
  subjects = [
    # Cold chain: fixture probes, and the reefers' return-air probes. A trailer
    # is addressed as an asset and a fixture as telemetry; same contract.
    "telemetry.*.*.temperature",
    "asset.*.*.temperature",
    # Battery: the second operation temp-probe and door-sensor both declare.
    # TP-005 sits at 19% and falling — `thing_percent < 25` is the panel.
    "telemetry.*.*.battery",
    "event.*.*.battery",
    # Heartbeat: the operation every device type declares. This is the series
    # that answers "is it alive", which no inventory count can —
    #   count_over_time(thing_uptime{thing="TP-001"}[3m]) == 0
    # is a device that stopped reporting, and `stone_age_records` can never fire
    # on that because it counts things CONFIGURED.
    "telemetry.*.*.heartbeat",
    "event.*.*.heartbeat",
    "asset.*.*.heartbeat",
    "gateway.*.*.heartbeat",
    "app.*.*.heartbeat",
    # Dock doors: an event, not a sample. `duration` is how long the door held
    # its previous state, so the series is dwell time by door.
    "event.*.*.door",
    # WMS shipments: an application is a Thing and gets a panel like one.
    "app.wms.*.shipment",
  ]
  # Only matters if you run more than one Telegraf against this account, and
  # harmless with one. It is what makes a second instance share the load rather
  # than duplicate every sample.
  queue_group = "telegraf-northwind"
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "RFC3339"
  # The union of every string key worth grouping by, across all eleven subjects.
  # `version` — the fleet's firmware spread. `state` — open/closed on a door.
  # `event` + `site` — a shipment's lifecycle stage and which DC it is at; `site`
  # is a real location code, in the payload because an `app.` subject has nowhere
  # to carry one.
  #
  # NOT here, deliberately: `order` and `trace` from the shipment payload. One
  # series per order number is unbounded, and a trace id is an identity — it
  # belongs in a log. `probe` is also left out: it repeats the thing code for
  # fixtures and says "return-air" for reefers, so it groups nothing.
  tag_keys = ["version", "state", "event", "site"]

# =============================================================================
# PROCESSORS — location and thing, out of the subject
# =============================================================================
# nats_consumer stamps every metric with a `subject` tag, which is the only place
# the device's identity exists — the payloads carry readings, not addresses.
#
# TWO BLOCKS, BECAUSE THERE ARE TWO SUBJECT SHAPES. A device is addressed
# `<root>.{location}.{thing}.{operation}`. An application is addressed
# `app.{kind}.{thing}.{operation}` — the second slot is an app subtree token
# (`wms`, `rules`), NOT a location. A connector is software; it has no site.
# Parsing both with the device pattern put `location="wms"` and
# `location="rules"` on the wire: nothing errors, the series look fine, and the
# first person to build a by-site panel gets two sites that do not exist. So the
# app shape is split out by `tagpass` on the subject and its second slot is
# tagged what it actually is.
#
# Both use the regex processor's batch mode: when ALL capture groups are named
# and NEITHER `replacement` NOR `result_key` is given, each group becomes a tag
# named after the group. Supply either of those two keys and it quietly falls
# back to single-value mode, which is the one way to get these blocks wrong.
#
# A non-matching subject is left alone rather than erroring — it arrives with no
# location/thing tags, which is visible in Grafana rather than silent.
#
# The `namepass` globs are not decoration: without them, a merged config that
# also carried the access-control inputs would mis-parse `acc.KC-DC1.door.…`
# with the four-token device pattern and tag a door as a thing called "door".

# ---- Devices: telemetry., event., asset., gateway.
[[processors.regex]]
  namepass = ["thing"]
  [processors.regex.tagdrop]
    subject = ["app.*"]
  [[processors.regex.tags]]
    key = "subject"
    pattern = '^[^.]+\.(?P<location>[^.]+)\.(?P<thing>[^.]+)\.'

# ---- Applications: app.{kind}.{thing}. Same slot position, different meaning,
# so it gets a different tag name rather than a wrong one.
[[processors.regex]]
  namepass = ["thing"]
  [processors.regex.tagpass]
    subject = ["app.*"]
  [[processors.regex.tags]]
    key = "subject"
    pattern = '^app\.(?P<app_kind>[^.]+)\.(?P<thing>[^.]+)\.'
