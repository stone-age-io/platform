# =============================================================================
# Ironbridge Manufacturing — live plant telemetry
# =============================================================================
# Companion to demo/rules/northwind/telemetry.yaml, which carries the long-form
# notes on subject composition, why publish mode is `core` here, and what the
# six-field cron and the `{@random.*}` functions are and are not for. Read that
# file first; this one assumes it.
#
# Run this in its OWN rule-router process, authenticated into the IRONBRIDGE
# NATS account:
#
#   rule-router --config config/rule-scheduler.yaml --rules demo/rules/ironbridge
#
# Ironbridge is the org the seed leaves UNMANAGED (`managed: false`), so unlike
# Northwind and Galewind it exports nothing to the operator hub. Nothing in this
# file depends on that; it is worth knowing because the Northwind and Galewind
# demos have a second place their traffic can be observed from and this one does
# not.
#
# Plant runs two shifts, Mon-Fri 06:00-22:00 Eastern. Everything below is gated
# on that in the cron rather than in a condition, so an idle plant overnight is
# visible as an idle plant rather than as a broken demo. With a seconds field in
# play, read those crons carefully: `*/5 * 6-21 * * 1-5` is every five SECONDS
# during shift, not every five minutes.

# -----------------------------------------------------------------------------
# PANEL POWER — the signal worth charting
#
# PM-001 meters Building 1 fabrication and reports every five seconds across the
# band a working shift draws. Point a chart at `telemetry.PIT-B1.PM-001.power`
# with jsonPath `$.kw`.
#
# This one rule replaces four phase-shifted ones. Power factor tracks load
# loosely rather than exactly — the two random ranges are independent, so an
# occasional high-kW/high-pf sample appears that a real panel would not produce.
# That is the honest limit of bounded noise: it gets the RANGE right and the
# CORRELATION wrong, which is fine for a chart and wrong for anything computing
# apparent power from these three numbers.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/5 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.PIT-B1.PM-001.power"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","kw":{@random.float(398.0,548.0,1)},"kvar":{@random.float(112.0,171.0,1)},"pf":{@random.float(0.90,0.97,2)},"voltage_ll":{@random.float(477.2,479.8,1)}}'

# Overnight base load, when the presses are down and only the chillers and air
# compressors are running. Same meter, a tenth of the power — the contrast is
# the point, and it is the sort of thing an energy dashboard exists to show.
- trigger:
    schedule:
      cron: "*/15 * 22-23,0-5 * * *"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.PIT-B1.PM-001.power"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","kw":{@random.float(42.0,53.0,1)},"kvar":{@random.float(17.0,22.0,1)},"pf":{@random.float(0.90,0.94,2)},"voltage_ll":{@random.float(480.4,482.1,1)}}'

- trigger:
    schedule:
      cron: "*/10 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.PIT-B2.PM-002.power"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","kw":{@random.float(262.0,318.0,1)},"kvar":{@random.float(84.0,101.0,1)},"pf":{@random.float(0.93,0.97,2)},"voltage_ll":{@random.float(478.9,480.6,1)}}'

- trigger:
    schedule:
      cron: "*/20 * * * * *"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.PIT-MCC1.PM-003.power"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","kw":{@random.float(58.0,71.0,1)},"kvar":{@random.float(19.0,24.0,1)},"pf":{@random.float(0.93,0.96,2)},"voltage_ll":{@random.float(479.4,481.0,1)}}'

# ---- More of the fleet, previously silent.
#
# PM-004 through PM-006 are seeded by `fillThings` on the same PIT-B1 / PIT-B2 /
# PIT-MCC1 round-robin as the three above, and said nothing. Sub-panels rather
# than main incomers, so the numbers are smaller — an energy dashboard with one
# meter per building has nothing to break down, which is half of what an energy
# dashboard is for.
- trigger:
    schedule:
      cron: "*/20 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.PIT-B1.PM-004.power"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","kw":{@random.float(88.0,124.0,1)},"kvar":{@random.float(28.0,41.0,1)},"pf":{@random.float(0.91,0.95,2)},"voltage_ll":{@random.float(478.0,480.2,1)}}'

- trigger:
    schedule:
      cron: "*/20 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.PIT-B2.PM-005.power"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","kw":{@random.float(64.0,97.0,1)},"kvar":{@random.float(20.0,33.0,1)},"pf":{@random.float(0.92,0.96,2)},"voltage_ll":{@random.float(479.1,481.3,1)}}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.PIT-MCC1.PM-006.power"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","kw":{@random.float(31.0,44.0,1)},"kvar":{@random.float(10.0,16.0,1)},"pf":{@random.float(0.92,0.95,2)},"voltage_ll":{@random.float(479.8,481.4,1)}}'

# -----------------------------------------------------------------------------
# BEARING VIBRATION — reduced on the device, not on the bus
#
# The sensor samples at kHz and publishes an RMS/peak summary. That reduction
# happens on the device on purpose: shipping raw waveform to the hub would be the
# expensive way to compute the same three numbers, and the schema records what
# was actually sent rather than what was measured.
#
# VS-002 on Line B runs high — around 6.4 mm/s RMS against a 4.5 alarm threshold
# on a machine of this class. That is the reading a maintenance rule should
# watch, and its band is deliberately kept ABOVE the threshold rather than
# straddling it: a fault that intermittently clears itself is a different and
# much less useful demo than a fault that is simply present.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/10 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.LINE-A.VS-001.vibration"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","rms_mm_s":{@random.float(1.7,2.6,1)},"peak_mm_s":{@random.float(4.9,6.4,1)},"axis":"x"}'

- trigger:
    schedule:
      cron: "*/10 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.LINE-B.VS-002.vibration"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","rms_mm_s":{@random.float(5.9,7.1,1)},"peak_mm_s":{@random.float(16.2,19.4,1)},"axis":"y"}'

- trigger:
    schedule:
      cron: "*/15 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.LINE-C.VS-003.vibration"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","rms_mm_s":{@random.float(1.3,2.0,1)},"peak_mm_s":{@random.float(3.6,4.9,1)},"axis":"z"}'

# ---- A second sensor on each line, previously silent. Different axis, same
# machine: one point per line cannot distinguish a bearing from an imbalance, and
# a maintenance screen that shows two axes per line is the first thing anyone
# building one would ask for.
- trigger:
    schedule:
      cron: "*/15 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.LINE-A.VS-004.vibration"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","rms_mm_s":{@random.float(1.9,2.9,1)},"peak_mm_s":{@random.float(5.1,6.9,1)},"axis":"z"}'

- trigger:
    schedule:
      cron: "*/15 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.LINE-B.VS-005.vibration"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","rms_mm_s":{@random.float(2.4,3.5,1)},"peak_mm_s":{@random.float(6.8,9.1,1)},"axis":"x"}'

- trigger:
    schedule:
      cron: "*/20 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "telemetry.LINE-C.VS-006.vibration"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","rms_mm_s":{@random.float(1.1,1.8,1)},"peak_mm_s":{@random.float(3.1,4.4,1)},"axis":"y"}'

# -----------------------------------------------------------------------------
# MACHINE CYCLES — the unit of OEE, and the busiest traffic in this file
#
# One completed cycle per line every fifteen to thirty seconds during shift. That
# is still a SAMPLED view rather than the real rate — a press on a short die runs
# faster than one cycle per fifteen seconds — but the old note here said "no
# amount of rule-writing gets under one minute", and that is no longer true. The
# floor is one second now, and the reason these are not at the floor is judgement
# rather than a limit: a cycle every second for three lines fills the console
# widget faster than anyone can read it.
#
# `part` and `operator` are drawn with `{@random.choice(...)}`, which is what
# gives a table on this subject more than one distinct row.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/15 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-A.LC-LINE-A.cycle"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","seconds":{@random.float(39.4,46.2,1)},"good":true,"part":"{@random.choice(IB-4471-A,IB-4471-C,IB-5518-A)}","operator":"BADGE-{@random.choice(1180,1191,1207)}"}'

- trigger:
    schedule:
      cron: "*/20 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-B.LC-LINE-B.cycle"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","seconds":{@random.float(54.8,62.7,1)},"good":true,"part":"{@random.choice(IB-4471-B,IB-5518-B)}","operator":"BADGE-{@random.choice(1204,1216)}"}'

- trigger:
    schedule:
      cron: "*/30 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-C.LC-LINE-C.cycle"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","seconds":{@random.float(86.1,97.9,1)},"good":true,"part":"{@random.choice(IB-4471-FA,IB-5518-FA)}","operator":"BADGE-{@random.choice(1219,1228)}"}'

# A scrapped part every 13 minutes on Line B — the `good: false` cycles are the
# quality term in OEE, and a demo where every cycle passes has nothing to
# compute.
#
# THIS IS A SEPARATE RULE ON PURPOSE, and it is the clearest case in these files
# for not reaching for `{@random.choice(true,false)}`. A choice would make the
# scrap RATE random too, and the scrap rate is the number the whole OEE quality
# term is built from — a demo that cannot state its own scrap rate is not
# demonstrating OEE. The cron sets the rate; random sets the values within it.
- trigger:
    schedule:
      cron: "*/13 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-B.LC-LINE-B.cycle"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","seconds":{@random.float(58.2,68.4,1)},"good":false,"part":"{@random.choice(IB-4471-B,IB-5518-B)}","operator":"BADGE-{@random.choice(1204,1216)}"}'

# -----------------------------------------------------------------------------
# HEARTBEATS — the operation every device type here declares and none used to send
#
# power-meter, vib-sensor and line-controller all declare publish_heartbeat, and
# until now only the gateway and the two applications sent one. See the Northwind
# file for why that mattered: without it the console cannot tell a commissioned
# device from a recorded one, which is the distinction `active` exists to make.
#
# Not gated on shift. A meter does not stop existing at 22:00, and a heartbeat
# that respected business hours would make every device look dead overnight —
# which is the opposite of what a heartbeat is for.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "telemetry.PIT-B1.PM-001.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(8640000,8640200)},"comms":"modbus-tcp"}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "telemetry.PIT-B2.PM-002.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(7776000,7776200)},"comms":"modbus-tcp"}'

- trigger:
    schedule:
      cron: "*/45 * * * * *"
  action:
    nats:
      subject: "telemetry.LINE-A.VS-001.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(1209600,1209800)},"rssi_dbm":{@random.int(-66,-54)}}'

- trigger:
    schedule:
      cron: "*/45 * * * * *"
  action:
    nats:
      subject: "telemetry.LINE-B.VS-002.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(1036800,1037000)},"rssi_dbm":{@random.int(-79,-68)}}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "line.LINE-A.LC-LINE-A.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(2592000,2592200)},"scan_ms":{@random.int(8,14)}}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "line.LINE-B.LC-LINE-B.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(2592000,2592200)},"scan_ms":{@random.int(9,16)}}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "line.LINE-C.LC-LINE-C.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(1814400,1814600)},"scan_ms":{@random.int(11,19)}}'

# -----------------------------------------------------------------------------
# ALARMS — raised AND cleared
#
# `active` is a field on the alarm, not a separate subject, so an alarm is
# cleared by publishing the same code with `active: false`. Both rules exist for
# the same reason the fire drill in the access-control demo has two: a raise with
# no matching clear leaves a permanent red badge that stops meaning anything
# about twenty minutes into a demo.
#
# ALARMS STAY ON MINUTE CRONS. Everything else in this file got faster; these did
# not, and the reason is the same one that keeps the Northwind excursion on a
# 47-minute cron. An alarm that fires every few seconds is not an alarm, it is
# wallpaper, and the pairing above only reads as a pairing if there is a visible
# gap between the raise and the clear.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "7,37 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-B.LC-LINE-B.alarm"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","code":"E-2204","severity":"warning","active":true,"message":"Weld current out of band on station 3"}'

- trigger:
    schedule:
      cron: "11,41 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-B.LC-LINE-B.alarm"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","code":"E-2204","severity":"warning","active":false,"message":"Weld current back in band"}'

# A critical one, twice a shift, on the press line.
- trigger:
    schedule:
      cron: "23 9,15 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-A.LC-LINE-A.alarm"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","code":"E-1102","severity":"critical","active":true,"message":"Die protection fault - press stopped"}'

- trigger:
    schedule:
      cron: "31 9,15 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-A.LC-LINE-A.alarm"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","code":"E-1102","severity":"critical","active":false,"message":"Die protection cleared - press restarted"}'

# -----------------------------------------------------------------------------
# LINE MODE — the instruction, and the echo that makes it checkable
#
# `.mode` is a SUBSCRIBE operation on the line controller: the controller
# listens, and something else publishes. `.mode.echo` is the controller's
# publish of the mode actually in force. Pair a `twin_desired` value against the
# ECHO, never against a measurement — the same rule the reefer setpoints
# illustrate in the Northwind file.
#
# NO RANDOM ANYWHERE IN THIS SECTION, and that is the point of putting it right
# after a section full of it. A mode is an assertion, not a measurement. The
# moment `{@random.choice(run,changeover)}` appears here the echo stops echoing
# anything and every desired/reported pairing in the Digital Twin screen goes
# permanently red.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "0 6 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-A.LC-LINE-A.mode"
      mode: core
      payload: '{"mode":"run","issued_by":"MES-CONN-01"}'

- trigger:
    schedule:
      cron: "0 14 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-A.LC-LINE-A.mode"
      mode: core
      payload: '{"mode":"changeover","issued_by":"MES-CONN-01"}'

- trigger:
    schedule:
      cron: "*/30 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "line.LINE-A.LC-LINE-A.mode.echo"
      mode: core
      payload: '{"mode":"run","issued_by":"LC-LINE-A"}'

# -----------------------------------------------------------------------------
# APPLICATIONS AND THE GATEWAY
#
# OEE-01 is an eKuiper stream processor. It is a Thing with a signed identity
# exactly like the meters above, and it does the windowed aggregation the rule
# engine deliberately does not — a rule engine answers "is this reading out of
# band right now", not "what was availability over the last fifteen minutes".
#
# Its three factors move independently here, which means the published `oee` is
# NOT their product. A real OEE feed would compute it; this one cannot, because
# a template has no arithmetic and adding some would turn the template engine
# into an expression language. If you are pointing a gauge at `$.oee`, point it
# at that field and do not check the multiplication.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/20 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "app.oee.OEE-01.oee"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","window_mins":15,"availability":{@random.float(0.86,0.94,2)},"performance":{@random.float(0.81,0.91,2)},"quality":{@random.float(0.96,0.99,2)},"oee":{@random.float(0.71,0.83,3)},"line":"LINE-A"}'

- trigger:
    schedule:
      cron: "10,30,50 * 6-21 * * 1-5"
      timezone: "America/New_York"
  action:
    nats:
      subject: "app.oee.OEE-01.oee"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","window_mins":15,"availability":{@random.float(0.78,0.88,2)},"performance":{@random.float(0.74,0.84,2)},"quality":{@random.float(0.91,0.96,2)},"oee":{@random.float(0.56,0.68,3)},"line":"LINE-B"}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "app.oee.OEE-01.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(907200,907400)},"streams":{@random.int(6,9)}}'

- trigger:
    schedule:
      cron: "15,45 * * * * *"
  action:
    nats:
      subject: "app.mes.MES-CONN-01.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(2592000,2592200)},"queue":{@random.int(0,7)}}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "gateway.PIT-MCC1.GW-PIT-01.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(5184000,5184200)},"load":{@random.float(0.15,0.72,2)}}'

# =============================================================================
# DIAGNOSTICS — a responder, not a schedule
# =============================================================================
# `reply_diagnostics` is a `reply` capability on line-controller and
# edge-gateway: the thing subscribes to its own `<prefix>.diag` and answers on
# the requester's inbox. Nothing fires on a cron, so nothing shows on a chart
# until somebody asks.
#
# `features.router: true` MUST BE SET alongside `features.scheduler: true`, or
# the core-NATS responder never starts, these rules load in silence and every
# request times out. The full reasoning — why no `conditions`, why the transport
# is core and cannot be jetstream, and how to test it from the console's
# Publisher widget instead of a shell — is in the Northwind file.
#
#   nats req --creds console-marcus.creds line.LINE-A.LC-LINE-A.diag ''
#
# `mode` below is FIXED and matches each line's `.mode.echo` and its `twin` key:
# run, run, changeover. A diagnostics reply that disagreed with the echo about
# the mode in force would break the Digital Twin screen's whole claim, and it is
# the same rule the line-mode section states — random on measurements, never on
# assertions.
# =============================================================================
- trigger:
    nats:
      subject: "line.LINE-A.LC-LINE-A.diag"
      reply: true
  action:
    respond:
      payload: '{"ts":"{@timestamp.iso}","thing":"LC-LINE-A","plc":"Rockwell CompactLogix 5380","rack_slot":"1/0","uptime":{@random.int(2592000,2592200)},"mode":"run","scan_ms":{@random.int(8,14)},"io_ok":true,"faults":[],"cycles_today":{@random.int(310,430)}}'

- trigger:
    nats:
      subject: "line.LINE-B.LC-LINE-B.diag"
      reply: true
  action:
    respond:
      payload: '{"ts":"{@timestamp.iso}","thing":"LC-LINE-B","plc":"Rockwell CompactLogix 5380","rack_slot":"1/0","uptime":{@random.int(2592000,2592200)},"mode":"run","scan_ms":{@random.int(9,16)},"io_ok":true,"faults":[],"cycles_today":{@random.int(280,395)}}'

# Line C is in changeover, which is why its reply carries no cycle count worth
# reading and a `mode` that differs from the other two. Ask all three in a row
# from a Button widget and the fleet's state is legible in three clicks.
- trigger:
    nats:
      subject: "line.LINE-C.LC-LINE-C.diag"
      reply: true
  action:
    respond:
      payload: '{"ts":"{@timestamp.iso}","thing":"LC-LINE-C","plc":"Siemens S7-1500","rack_slot":"0/1","uptime":{@random.int(1814400,1814600)},"mode":"changeover","scan_ms":{@random.int(11,19)},"io_ok":true,"faults":[],"cycles_today":0}'

- trigger:
    nats:
      subject: "gateway.PIT-MCC1.GW-PIT-01.diag"
      reply: true
  action:
    respond:
      payload: '{"ts":"{@timestamp.iso}","thing":"GW-PIT-01","version":"0.4.0","uptime":{@random.int(5184000,5184200)},"load":{@random.float(0.15,0.72,2)},"wan":"up","wan_type":"fibre","leaf":"connected","leaf_lag_s":{@random.int(0,2)},"disk_free_pct":{@random.int(38,59)},"oee_pipeline":"running","clients":{@random.int(12,18)}}'

# MES-CONN-01 declares `publish` and `request` and no `reply`, so it is not a
# responder and nothing here answers for it. See the note at the end of the
# Northwind diagnostics section for why a scheduler cannot stand in for the
# requesting half of request/reply.

# =============================================================================
# DIGITAL TWIN — reported state only
# =============================================================================
# Requires the `twin` bucket to exist (console → NATS → KV Buckets → Initialize).
# The full reasoning — why `$KV.{bucket}.{key}`, why `mode: jetstream`, why
# nothing here ever writes `twin_desired`, and why these stay on minute crons
# when everything above them got faster — is in the Northwind file. Delete this
# section if you have not created the bucket.
# =============================================================================

# The echo, which is the key a desired mode should be paired with. Fixed values.
- trigger:
    schedule:
      cron: "*/3 * * * *"
  action:
    nats:
      subject: "$KV.twin.thing.LC-LINE-A.mode"
      mode: jetstream
      payload: '"run"'

- trigger:
    schedule:
      cron: "*/3 * * * *"
  action:
    nats:
      subject: "$KV.twin.thing.LC-LINE-B.mode"
      mode: jetstream
      payload: '"run"'

# Line C is in changeover. Set `twin_desired` `thing.LC-LINE-C.mode` to `"run"`
# in the console and the Digital Twin row shows `"changeover" → "run"` — the
# values themselves, not the word "differs", because "differs on: mode" is the
# same width and sends the reader off to look both values up.
- trigger:
    schedule:
      cron: "*/3 * * * *"
  action:
    nats:
      subject: "$KV.twin.thing.LC-LINE-C.mode"
      mode: jetstream
      payload: '"changeover"'

- trigger:
    schedule:
      cron: "*/4 * * * *"
  action:
    nats:
      subject: "$KV.twin.thing.GW-PIT-01.status"
      mode: jetstream
      payload: '{"wan":"up","leaf":"connected","oee_pipeline":"running","version":"0.4.0","clients":{@random.int(12,18)}}'
