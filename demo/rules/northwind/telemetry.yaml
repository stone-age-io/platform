# =============================================================================
# Northwind Traders — live telemetry for the `stone-age demo-seed` inventory
# =============================================================================
# rule-router scheduler rules that put traffic on the subjects the seeded
# Northwind things declare, so the Visualizer's charts, stats, gauges, KV
# browser and console widgets have something to draw.
#
# ONE FILE PER ORGANIZATION, AND ONE rule-router PER FILE. In NATS operator mode
# the ACCOUNT is the tenant boundary: Northwind, Ironbridge and Galewind each
# hold their own account, and a connection authenticated into one cannot publish
# into another. That is not a rule-router limitation to work around — it is the
# platform's isolation model, and three processes is what honouring it looks
# like. See demo/rules/README.md for which credential to use.
#
# SUBJECTS ARE COMPOSED, NOT INVENTED. Every subject below is a thing type's
# `subject_prefix` with the operation's `subject_suffix` appended, exactly as the
# console's Thing Type screen renders it:
#
#   telemetry.{location}.{thing}  +  temperature  ->  telemetry.KC-DC1-FZ1.TP-001.temperature
#   asset.{location}.{thing}      +  setpoint.echo -> asset.TRL-1180.REEFER-1180.setpoint.echo
#   app.wms.{thing}               +  shipment     ->  app.wms.WMS-CONN-01.shipment
#
# No subject carries an organization token, and that is deliberate: inside NATS
# the account already IS the tenant, so an org token here would be redundant.
# The single place one appears in this platform is on the way OUT of an account,
# in a managed org's `helpdesk.{code}.>` export — which is exactly why it is
# unforgeable there and pointless here.
#
# PUBLISH MODE: `core` throughout. The demo seed creates no JetStream streams,
# and the console's widgets subscribe over plain core NATS
# (`useSubscriptionManager` calls `nc.subscribe`). A jetstream publish to these
# subjects would hang waiting for an ack no stream will send. The one exception
# is the twin section at the bottom, which writes into a KV bucket — that is a
# stream, and the ack is what tells you the bucket exists.
#
# PREREQUISITES
#   ./stone-age migrate up
#   ./stone-age demo-seed --confirm
#   rule-router --config config/rule-scheduler.yaml --rules demo/rules/northwind
#
#   Point --rules at demo/rules/northwind, NOT at demo/rules. rule-router walks
#   the directory recursively, so the parent would load all three organizations
#   into one process — and every subject belonging to the other two would then be
#   published on a connection with no permission for it, filling the log with
#   authorization errors for rules that are perfectly correct.
#
#   Needs a rule-router with six-field cron and the `{@random.*}` functions. On a
#   build without them every rule here fails to load, loudly, at startup — which
#   is the right failure: a silently ignored seconds field would publish sixty
#   times slower than this file claims.
#
# ------------------------------- SECONDS, AND A VALUE THAT MOVES --------------
# These files used to open with a section headed "the one-minute floor, and what
# it costs". Both halves of that cost are gone:
#
#   * Cron takes an optional SECONDS field. `*/5 * * * * *` is every five
#     seconds, so a chart fills in under a minute instead of half an hour. One
#     second is the floor — cron cannot express less — and a rule that fires
#     faster than its action completes drops the overlap rather than stacking it,
#     countable as `scheduler_job_runs_total{status="singleton_rescheduled"}`.
#
#   * `{@random.float(min,max,decimals)}`, `{@random.int(min,max)}` and
#     `{@random.choice(a,b)}` put motion in a payload. The six phase-shifted
#     rules that used to drive TP-001 are now one rule.
#
# WHAT THAT TRADE ACTUALLY IS, said plainly: the six-rule block modelled a
# compressor cycle — a repeating SHAPE. A random band is BOUNDED NOISE, and no
# amount of it will ever draw a sawtooth. For a probe sitting in a working
# freezer that is arguably the more honest picture, because what a real probe
# reports between compressor calls is jitter around setpoint. Where the shape is
# the point, phase-shifted rules still work — they just phase-shift on seconds
# now. Nothing in this file needs that, so nothing in this file does it.
#
# These functions are FIXTURE DATA and rule-router documents them as such. They
# are not for nonces (`{@uuid4()}`), correlation ids (`{@uuid7()}`), or anything
# a consumer will treat as an identity. Note also which rules below did NOT get a
# random value: setpoints and echoes stayed fixed, for a reason spelled out at
# the reefer section.
#
# --------------------------------- WHY MOST THINGS HERE ARE SILENT ------------
# The seed creates about 120 things; this file speaks for roughly thirty. That is
# still the shape of a real rollout — inventory is recorded long before every
# device is commissioned — and a demo where all 120 reported would misrepresent
# both the platform and the work. The silent ones are the reason the Things list
# has an `active` filter and the reason `stone_age_records` is documented as a
# count of things CONFIGURED rather than things alive.

# -----------------------------------------------------------------------------
# COLD CHAIN — Freezer Zone 1, the signal worth charting
#
# TP-001 sits in KC-DC1-FZ1 against a -18C setpoint and reports every five
# seconds, jittering across the band a working freezer holds. Point a chart
# widget at `telemetry.KC-DC1-FZ1.TP-001.temperature` with jsonPath `$.celsius`
# and it draws a live trace within about ten seconds of starting the scheduler.
#
# This one rule replaces six. The six existed because a payload used to be a
# fixed string, so the only way to make a series move was to write a different
# rule for each value and phase them across the minutes. That is the whole
# history of this block, and it is worth knowing before you write your own.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/5 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ1.TP-001.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(-19.4,-17.2,1)},"setpoint_c":-18.0,"probe":"TP-001"}'

# -----------------------------------------------------------------------------
# COLD CHAIN — the rest of the probes
#
# Bulk-generated probes cycle through the freezer, chilled and cross-dock zones
# in code order (TP-001 FZ1, TP-002 FZ2, TP-003 CH1, TP-004 SGF chilled, then
# round again), which is why the location in each subject below is not arbitrary
# — it is what `fillThings` assigned. Each band suits its zone: freezers hold
# near -18, chilled bays near +2.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/15 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ2.TP-002.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(-19.1,-17.6,1)},"setpoint_c":-18.0,"probe":"TP-002"}'

- trigger:
    schedule:
      cron: "*/15 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-CH1.TP-003.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(1.6,3.2,1)},"setpoint_c":2.0,"probe":"TP-003"}'

- trigger:
    schedule:
      cron: "*/15 * * * * *"
  action:
    nats:
      subject: "telemetry.SGF-XD2-CH1.TP-004.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(2.2,3.9,1)},"setpoint_c":2.0,"probe":"TP-004"}'

- trigger:
    schedule:
      cron: "*/20 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ2.TP-006.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(-18.9,-17.4,1)},"setpoint_c":-18.0,"probe":"TP-006"}'

# ---- More of the fleet, previously silent.
#
# TP-007 through TP-010 are seeded exactly like the four above and said nothing,
# for no reason other than what a moving signal used to cost: six rules each. At
# one rule each that reason is gone, so the Chilled Zone and the Springfield bay
# now have more than one probe apiece and a stat grid or a table has rows to
# fill. Their locations follow the same round-robin — check `fillThings` before
# adding TP-011 rather than guessing.
- trigger:
    schedule:
      cron: "*/20 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-CH1.TP-007.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(1.4,2.9,1)},"setpoint_c":2.0,"probe":"TP-007"}'

- trigger:
    schedule:
      cron: "*/20 * * * * *"
  action:
    nats:
      subject: "telemetry.SGF-XD2-CH1.TP-008.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(1.9,3.4,1)},"setpoint_c":2.0,"probe":"TP-008"}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ1.TP-009.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(-19.2,-17.8,1)},"setpoint_c":-18.0,"probe":"TP-009"}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ2.TP-010.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(-18.8,-17.3,1)},"setpoint_c":-18.0,"probe":"TP-010"}'

# THE EXCURSION. TP-005 shares Freezer Zone 1 with TP-001 and reports a
# temperature well above setpoint every 47 minutes — a door left open, a failed
# defrost termination, or a probe hanging in warm air. This is the reading the
# cold-chain rule-router instance (thing RULES-COLD-01) exists to catch, and it
# is what a threshold rule should watch: REPORTED state, over time.
#
# DELIBERATELY STILL ON A MINUTE CRON. An excursion every five seconds is not an
# excursion, it is a broken freezer, and this rule's entire value is being rare
# enough to stand out against TP-001's steady band. Sub-minute cron is a
# capability, not an instruction.
#
# Note where a range does NOT belong — a range is not a desired value, and
# putting `{"min":-20,"max":-16}` in `twin_desired` would be a rules engine
# hiding in a KV bucket.
- trigger:
    schedule:
      cron: "*/47 * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ1.TP-005.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(-9.2,-6.4,1)},"setpoint_c":-18.0,"probe":"TP-005"}'

# -----------------------------------------------------------------------------
# BATTERY — the second operation these probes declare
#
# A reminder that a thing type's operations are a LIST rather than a single feed:
# `temp-probe` declares publish_temperature, publish_battery and
# publish_heartbeat, and a demo exercising only the first makes the other two
# look decorative.
#
# THE BANDS ARE NARROW ON PURPOSE. A battery does not jitter, it drains, so a
# wide random range would read as a broken gauge rather than a live one. What
# moves across a couple of tenths here is ADC noise, which is what the reading
# actually contains. This is the general shape of the judgement each `random`
# range in this file represents: the width is a claim about the physics.
#
# TP-005 is the one to watch — 19% and falling is the second reason that probe
# shows up on a dashboard.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/2 * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ1.TP-001.battery"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","percent":{@random.int(77,79)},"volts":{@random.float(3.39,3.43,2)}}'

- trigger:
    schedule:
      cron: "*/2 * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ1.TP-005.battery"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","percent":{@random.int(18,20)},"volts":{@random.float(3.00,3.05,2)}}'

- trigger:
    schedule:
      cron: "*/3 * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-CH1.TP-003.battery"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","percent":{@random.int(91,93)},"volts":{@random.float(3.55,3.60,2)}}'

# -----------------------------------------------------------------------------
# HEARTBEATS — the operation every device type declares and none used to send
#
# `publish_heartbeat` is on temp-probe, door-sensor, reefer-unit and
# edge-gateway here, and on power-meter, vib-sensor, line-controller,
# turbine-ctl, feeder-relay and met-mast in the other two files. Until now only
# gateways and applications sent one, which left the console unable to
# distinguish a commissioned device from a merely recorded one — the exact
# distinction `active` exists to make legible.
#
# Thirty to forty-five seconds is a realistic device heartbeat and fast enough
# that a "last seen" column means something during a demo. `uptime` jitters by a
# few seconds rather than counting up, because a scheduler standing in for a
# device holds no state and a counter that reset on every restart would be a
# worse lie than a wobble.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ1.TP-001.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(2419100,2419300)},"rssi_dbm":{@random.int(-74,-62)}}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-FZ1.TP-005.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(986000,986200)},"rssi_dbm":{@random.int(-89,-81)}}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "telemetry.KC-DC1-CH1.TP-003.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(1728000,1728200)},"rssi_dbm":{@random.int(-71,-58)}}'

- trigger:
    schedule:
      cron: "*/45 * * * * *"
  action:
    nats:
      subject: "event.KC-DC1.DS-001.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(604700,604900)},"rssi_dbm":{@random.int(-68,-55)}}'

- trigger:
    schedule:
      cron: "*/45 * * * * *"
  action:
    nats:
      subject: "asset.TRL-1180.REEFER-1180.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(432000,432200)},"engine_hrs":{@random.int(14820,14823)}}'

- trigger:
    schedule:
      cron: "*/45 * * * * *"
  action:
    nats:
      subject: "asset.TRL-1184.REEFER-1184.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(259100,259300)},"engine_hrs":{@random.int(9310,9313)}}'

# -----------------------------------------------------------------------------
# DOCK DOORS — event, not telemetry
#
# A different subject root (`event.` rather than `telemetry.`) because a door
# transition is an event: it has a moment and a previous state, not a sample
# rate. The `device` NATS role grants both, which is why one credential covers a
# probe and a contact.
#
# `{@random.choice(open,closed)}` collapses each door's open/closed pair into a
# single rule. NOTE THE QUOTES around it and their absence around
# `{@random.int(...)}` on the next field: choice renders a string and int renders
# a bare number, so JSON needs one quoted and the other not. It is the same split
# `{@uuid7()}` and `{@time.hour}` have always had.
#
# THE COST OF `choice` HERE: a door can report `open` twice running, which a real
# contact cannot. For a console widget scrolling events that reads fine; for
# anything computing dwell time from consecutive states it does not, and the
# honest fix is a device rather than a scheduler.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/20 5-21 * * 1-6"
  action:
    nats:
      subject: "event.KC-DC1.DS-001.door"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","state":"{@random.choice(open,closed)}","duration":{@random.int(45,2400)}}'

- trigger:
    schedule:
      cron: "*/30 5-21 * * 1-6"
  action:
    nats:
      subject: "event.SGF-XD2.DS-002.door"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","state":"{@random.choice(open,closed)}","duration":{@random.int(60,3800)}}'

- trigger:
    schedule:
      cron: "*/40 5-21 * * 1-6"
  action:
    nats:
      subject: "event.KC-DC1.DS-003.door"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","state":"{@random.choice(open,closed)}","duration":{@random.int(40,1500)}}'

# ---- DS-004 (Springfield) and DS-005 (KC) are seeded and were silent. Both are
# quieter than the three above, which is what a door at the far end of a dock
# actually looks like. The leading `0` and `30` are the SECONDS field: these fire
# at one instant within their minute rather than throughout it.
- trigger:
    schedule:
      cron: "0 */2 5-21 * * 1-6"
  action:
    nats:
      subject: "event.SGF-XD2.DS-004.door"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","state":"{@random.choice(open,closed)}","duration":{@random.int(90,2600)}}'

- trigger:
    schedule:
      cron: "30 */3 5-21 * * 1-6"
  action:
    nats:
      subject: "event.KC-DC1.DS-005.door"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","state":"{@random.choice(open,closed)}","duration":{@random.int(30,900)}}'

# The door sensors' own battery operation, which no rule used to exercise.
- trigger:
    schedule:
      cron: "*/4 * * * *"
  action:
    nats:
      subject: "event.KC-DC1.DS-001.battery"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","percent":{@random.int(84,86)},"volts":{@random.float(3.48,3.52,2)}}'

- trigger:
    schedule:
      cron: "*/4 * * * *"
  action:
    nats:
      subject: "event.SGF-XD2.DS-002.battery"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","percent":{@random.int(41,43)},"volts":{@random.float(3.18,3.22,2)}}'

# -----------------------------------------------------------------------------
# REEFER TRAILERS — a setpoint, and the echo that makes it checkable
#
# The reefer subscribes to `.setpoint` and publishes `.setpoint.echo`. That pair
# is the whole reason the platform can say anything honest about desired state:
# an echo converges exactly on the instruction, so "differs" means "the unit has
# not accepted it". Compare a desired setpoint against a measured `.temperature`
# instead and it differs forever, because an instruction and a continuous reading
# never converge — and no tolerance fixes that in general.
#
# NOTICE WHICH RULES BELOW GOT A RANDOM VALUE AND WHICH DID NOT. The temperatures
# did; the setpoint and its echo did not, and must not. An echo whose value
# wandered would stop being an echo — it is the unit repeating the instruction it
# accepted, and the instant it drifts by a tenth every desired/reported pairing in
# the Digital Twin screen goes permanently red. Random belongs on measurements,
# never on assertions. That distinction is the most useful thing in this file.
#
# `asset.` rather than `telemetry.` as the root: a trailer moves between sites and
# is addressed as an asset, not as a fixture of a building.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/10 * * * * *"
  action:
    nats:
      subject: "asset.TRL-1180.REEFER-1180.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(-19.3,-18.4,1)},"setpoint_c":-18.0,"probe":"return-air"}'

- trigger:
    schedule:
      cron: "*/10 * * * * *"
  action:
    nats:
      subject: "asset.TRL-1184.REEFER-1184.temperature"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","celsius":{@random.float(1.4,2.6,1)},"setpoint_c":2.0,"probe":"return-air"}'

- trigger:
    schedule:
      cron: "*/5 * * * *"
  action:
    nats:
      subject: "asset.TRL-1180.REEFER-1180.setpoint.echo"
      mode: core
      payload: '{"celsius":-18.0,"issued_by":"WMS-CONN-01","expires_at":""}'

- trigger:
    schedule:
      cron: "*/5 * * * *"
  action:
    nats:
      subject: "asset.TRL-1184.REEFER-1184.setpoint.echo"
      mode: core
      payload: '{"celsius":2.0,"issued_by":"WMS-CONN-01","expires_at":""}'

# The instruction itself, twice an hour: the WMS re-asserting a setpoint on a
# trailer about to be loaded. A `subscribe` operation on the thing type means the
# THING listens here — something else publishes, and in this demo that something
# is this rule. Fixed value, for the reason above.
- trigger:
    schedule:
      cron: "9,39 * * * *"
  action:
    nats:
      subject: "asset.TRL-1180.REEFER-1180.setpoint"
      mode: core
      payload: '{"celsius":-18.0,"issued_by":"WMS-CONN-01"}'

# -----------------------------------------------------------------------------
# APPLICATIONS — first-class participants, not a special case
#
# The WMS connector and the cold-chain rule engine hold signed NATS identities of
# their own and publish on their own subtrees, exactly like the probes above. A
# demo with nothing but sensors in it quietly contradicts the platform's central
# claim, which is that an application is a Thing.
#
# One rule now covers what took two: `{@random.choice(...)}` picks the event and
# the site, `{@random.int(...)}` moves the order number and the line count. The
# trace id stays `{@uuid7()}` — that is an identity, and `random.*` is fixture
# data. Mixing them up is the single most likely misuse of these functions.
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/20 * * * * *"
  action:
    nats:
      subject: "app.wms.WMS-CONN-01.shipment"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","event":"{@random.choice(picked,packed,staged,loaded)}","order":"SO-{@random.int(448100,448199)}","site":"{@random.choice(KC-DC1,SGF-XD2)}","lines":{@random.int(2,26)},"trace":"{@uuid7()}"}'

- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "app.rules.RULES-COLD-01.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(186400,186500)},"version":"1.9.0","rules":34}'

# -----------------------------------------------------------------------------
# GATEWAYS AND THE UNATTENDED SCREEN
# -----------------------------------------------------------------------------
- trigger:
    schedule:
      cron: "*/30 * * * * *"
  action:
    nats:
      subject: "gateway.KC-DC1-MDF.GW-KC-01.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(2419200,2419400)},"version":"0.4.0","load":{@random.float(0.10,0.85,2)}}'

- trigger:
    schedule:
      cron: "15,45 * * * * *"
  action:
    nats:
      subject: "gateway.SGF-XD2-MDF.GW-SGF-01.heartbeat"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","uptime":{@random.int(1209600,1209800)},"version":"0.4.0","load":{@random.float(0.05,0.60,2)}}'

# The dock display's only operation is a SUBSCRIBE. It renders what it is sent
# and publishes nothing at all — which is why its thing type defaults to the
# `console-readonly` NATS role, and why a demo that never publishes to it leaves
# a blank screen above the dock doors.
- trigger:
    schedule:
      cron: "*/30 5-21 * * 1-6"
  action:
    nats:
      subject: "display.KC-DC1.DISP-KC-01.render"
      mode: core
      payload: '{"ts":"{@timestamp.iso}","headline":"Doors 1-12","next_load":"SO-{@random.int(448100,448199)}","dock":"D{@random.int(1,12)}","eta":"{@random.choice(14:20,14:45,15:10,15:35)}"}'

# =============================================================================
# DIGITAL TWIN — reported state, and only reported state
# =============================================================================
# DELETE THIS SECTION IF YOU HAVE NOT CREATED THE BUCKETS. `twin` and
# `twin_desired` are NOT created by the platform server — it holds the NATS
# operator and has no user credential inside any organization's account, so it
# cannot reach in and make them. Create them from the console (NATS → KV Buckets
# → Initialize) or let `leaf-sync` do it, then come back.
#
# HOW THIS WRITES A KV KEY. rule-router has no KV action — only `nats`, `http`
# and `respond` — so these publish to the bucket's underlying stream subject,
# `$KV.{bucket}.{key}`. That is not a trick: a KV bucket IS a stream, and it is
# exactly what `nats kv put` does. What it skips is the revision bookkeeping of a
# compare-and-set, which a simulator standing in for a device does not need. If
# rule-router grows a first-class KV action, this section should use it.
#
# `mode: jetstream` here and nowhere else in the file: the ack is what tells you
# the bucket exists. Publish these core and a missing bucket looks exactly like a
# working demo with an empty screen.
#
# THESE STAY ON MINUTE CRONS, DELIBERATELY. A KV bucket keeps history —
# `--history=10` is ten revisions per key — so a key rewritten every five seconds
# has discarded everything older than the last minute by the time anyone opens
# the KV browser. Sub-minute cron is available everywhere in this file; a KV key
# is the clearest case for declining it.
#
# ONLY `twin` IS WRITTEN, NEVER `twin_desired`. One writer per bucket is the
# whole safety property: `twin` flows edge→hub and the device owns it,
# `twin_desired` flows hub→edge and the operator owns it. A single bucket written
# from both ends does not pick a loser on a conflict, it oscillates. This file
# stands in for the devices, so it writes the device's half and nothing else.
#
# TO SEE DRIFT: open Digital Twin, put `-20` in `twin_desired` under
# `thing.REEFER-1180.setpoint`, and watch the row show `-18 → -20`. Then watch
# nothing happen — no hook, no agent and no subscription in this platform applies
# a desired value to a device. The console says `differs`, never `pending`,
# because "waiting for the device" would assert a control loop that does not
# exist. Delivering the value to the edge's local KV is where the platform's job
# ends; what consumes it is the integrator's firmware or a rule-router rule.
# =============================================================================

# The two keys worth pairing a desired value against: setpoint ECHOES, which
# converge exactly on an instruction. FIXED VALUES, deliberately — see the reefer
# section for why an echo that wanders stops being an echo.
- trigger:
    schedule:
      cron: "*/2 * * * *"
  action:
    nats:
      subject: "$KV.twin.thing.REEFER-1180.setpoint"
      mode: jetstream
      payload: '-18.0'

- trigger:
    schedule:
      cron: "*/2 * * * *"
  action:
    nats:
      subject: "$KV.twin.thing.REEFER-1184.setpoint"
      mode: jetstream
      payload: '2.0'

# A whole object as a value. `twinDrift` compares a desired object as a PARTIAL
# assertion — only the keys present in the desired value are checked — so an
# assertion of `{"wan":"up"}` keeps holding the day this gateway starts reporting
# a field nobody has heard of yet. It is also why the moving `clients` count here
# is harmless: assert the fields that are claims, leave the ones that are
# measurements alone.
- trigger:
    schedule:
      cron: "*/3 * * * *"
  action:
    nats:
      subject: "$KV.twin.thing.GW-KC-01.status"
      mode: jetstream
      payload: '{"wan":"up","leaf":"connected","rules":34,"version":"0.4.0","clients":{@random.int(28,34)}}'

# A MEASUREMENT in reported state. This is fine — `twin` is where last-known
# reported state belongs, and a stat widget reading a last value rather than
# subscribing to a feed is a legitimate thing to build. What is NOT fine is
# pairing a desired value against this key: `temp = -18` desired against `-18.6`
# reported differs forever, because it compares an instruction to a continuous
# reading. If equality feels wrong for a key, the key is paired with a measurement
# instead of an echo — fix the pairing, don't add a tolerance. Now that the value
# actually moves, that mistake is obvious in one screen rather than arguable.
- trigger:
    schedule:
      cron: "*/2 * * * *"
  action:
    nats:
      subject: "$KV.twin.thing.TP-001.temp"
      mode: jetstream
      payload: '{@random.float(-19.4,-17.2,1)}'
