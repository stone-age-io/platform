# Release configuration. Ported from rule-router, with two differences that
# matter for this repo.
#
# 1. The Go build embeds the compiled console (`//go:embed all:pb_public/*`), so
#    the frontend has to be built before goreleaser compiles anything. That is
#    what the `before` hooks are for -- without them the binaries would ship the
#    tracked placeholder page.
#
# 2. Two binaries with very different jobs. `stone-age` is the server an operator
#    runs; `leaf-sync` is the agent that lands on customer hardware, which is why
#    linux/arm64 is not optional here.
version: 2

project_name: stone-age

before:
  hooks:
    # Plain command strings, not the {cmd, dir} form: this goreleaser rejects the
    # map form for before.hooks.
    - sh -c 'cd ui && npm ci'
    - sh -c 'cd ui && npm run build'

builds:
  - id: stone-age
    main: .
    binary: stone-age
    env:
      # Free, because PocketBase's SQLite driver is modernc.org/sqlite -- a
      # pure-Go translation. No C toolchain, so every target below
      # cross-compiles from one runner.
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X platform/internal/version.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # Windows on arm64 is not a deployment target for a server binary here.
      - goos: windows
        goarch: arm64

  - id: leaf-sync
    main: ./cmd/leaf-sync
    binary: leaf-sync
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X platform/internal/version.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

# One archive per binary, not one holding both. Someone provisioning an edge box
# wants leaf-sync and nothing else -- making them download an archive named after
# the server, containing a 40 MB control plane they will never run, is a bad first
# impression on the audience that matters most here.
archives:
  - id: stone-age
    ids: [stone-age]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config.yaml
    name_template: >-
      stone-age_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

  - id: leaf-sync
    ids: [leaf-sync]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      # The edge agent has its own configuration and its own deployment flow;
      # the platform README is not the document its operator needs.
      - src: cmd/leaf-sync/README.md
        dst: README.md
    name_template: >-
      leaf-sync_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# The release body is NOT built here. goreleaser's changelog is a list of commit
# subjects, and this repo's reasoning lives in CHANGELOG.md as paragraphs -- with
# upgrade notes that exist nowhere in the commit log. scripts/release-notes.sh
# assembles the body (install prose + the changelog section for the tag) and the
# release workflow passes it with --release-notes.
#
# Disabled rather than left at its default so the two cannot disagree: a body
# assembled both here and there is a body that drifts. The install prose that
# used to live in release.header/release.footer moved into that script for the
# same reason.
changelog:
  disable: true

release:
  github:
    owner: stone-age-io
    name: platform
  # A tag carrying a prerelease suffix (v0.4.1-rc1) is published as a GitHub
  # prerelease. The default is false, which would mark a release candidate as
  # "Latest" on the repository front page and hand it to anyone following the
  # releases feed.
  prerelease: auto
