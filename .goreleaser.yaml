# Release configuration. Ported from rule-router, with one difference that
# matters for this repo: the Go build embeds the compiled console
# (`//go:embed all:pb_public/*`), so the frontend has to be built before
# goreleaser compiles anything. That is what the `before` hooks are for --
# without them the binaries would ship the tracked placeholder page.
#
# ONE binary now. `leaf-sync` used to be released from here too, as the agent
# that lands on customer hardware; it was absorbed into the stone-age-io/agent
# repo, which releases it as `agent`. Nothing edge-side ships from this tree any
# more -- which is also why darwin/arm64 is a convenience target here rather than
# a fleet one.
version: 2

project_name: stone-age

before:
  hooks:
    # Plain command strings, not the {cmd, dir} form: this goreleaser rejects the
    # map form for before.hooks.
    - sh -c 'cd ui && npm ci'
    - sh -c 'cd ui && npm run build'

builds:
  - id: stone-age
    main: .
    binary: stone-age
    env:
      # Free, because PocketBase's SQLite driver is modernc.org/sqlite -- a
      # pure-Go translation. No C toolchain, so every target below
      # cross-compiles from one runner.
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X platform/internal/version.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # Windows on arm64 is not a deployment target for a server binary here.
      - goos: windows
        goarch: arm64

archives:
  - id: stone-age
    ids: [stone-age]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config.yaml
    name_template: >-
      stone-age_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# The release body is NOT built here. goreleaser's changelog is a list of commit
# subjects, and this repo's reasoning lives in CHANGELOG.md as paragraphs -- with
# upgrade notes that exist nowhere in the commit log. scripts/release-notes.sh
# assembles the whole body (install prose + the changelog section for the tag)
# and the release workflow passes it with --release-notes, which makes
# everything below inert on a real release.
#
# DO NOT set `disable: true` here. It looks like the tidy way to say "the body
# comes from elsewhere", and it silently breaks --release-notes: reading that
# file is a step INSIDE the changelog pipe, so disabling the pipe skips the read
# and publishes an empty body. v0.5.0 shipped that way and had to be edited by
# hand afterwards. The settings below are the fallback for someone running
# goreleaser without the flag, and the only thing that suppresses them is the
# flag itself.
#
# release.header / release.footer are gone for the adjacent reason: goreleaser
# does not apply them to a --release-notes body, so keeping them here would be
# prose that renders on a manual run and vanishes on a real one. The install
# prose lives in scripts/release-notes.sh, which is the one place the body is
# assembled.
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: stone-age-io
    name: platform
  # A tag carrying a prerelease suffix (v0.4.1-rc1) is published as a GitHub
  # prerelease. The default is false, which would mark a release candidate as
  # "Latest" on the repository front page and hand it to anyone following the
  # releases feed.
  prerelease: auto
