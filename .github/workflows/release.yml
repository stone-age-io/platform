# Cuts a release when a v* tag is pushed: cross-compiled binaries for both
# commands via goreleaser, and the container image to GHCR.
#
# The image is built with the repository's own Dockerfile rather than
# goreleaser's docker support, so there is one definition of the image and it is
# the one people can read and build locally. goreleaser would want a
# binary-copying Dockerfile of its own, which means two files that must agree.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser derives the version and the changelog from tags, and
          # a shallow clone has neither.
          fetch-depth: 0

      # goreleaser's `before` hooks build the console, because the Go binaries
      # embed it. Node has to be here for that to work.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: edge boxes and Pis are a real deployment
          # target for this product, and the binary is static either way.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/stone-age-io/platform:${{ github.ref_name }}
            ghcr.io/stone-age-io/platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
