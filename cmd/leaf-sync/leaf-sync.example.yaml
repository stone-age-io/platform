# leaf-sync configuration.
#
# Copy to leaf-sync.yaml and fill in the leaf node's PocketBase credentials —
# shown once when you create the leaf node in the platform UI ("New Leaf Node").
# Everything else (JetStream domain, synced collections, NATS creds, and the
# operator/account JWTs) is pulled from PocketBase automatically.
#
# Values can also be supplied via environment variables, e.g.
#   LEAF_SYNC_POCKETBASE_PASSWORD=...

pocketbase:
  url: https://platform.example.com   # central platform base URL
  email: edge01@acme.leaf.local        # leaf node email (from the UI success modal)
  password: ""                         # leaf node password (from the UI success modal)

nats:
  hub_leaf_url: nats-leaf://hub.example.com:7422  # where the leaf remote dials the hub
  local_url: nats://127.0.0.1:4222                # the local leaf this agent connects to
  creds_file: edge.creds                          # written by `config`, read by `run`
  hub_domain: hub                                 # hub's JetStream domain; enables the liveness
                                                  # heartbeat (leaf_status KV) and the twin relay.
                                                  # Empty = both off.

  # Run the leaf node inside this process instead of alongside it, from the
  # nats-leaf.conf `config` writes. Equivalent to `leaf-sync run --nats`; two
  # processes on the edge become one, and regenerating the config can no longer
  # leave a stale server running behind it.
  #
  # Off by default. Where systemd/Docker is already supervising services, a
  # separate nats-server is still the better shape: the bus then survives a
  # leaf-sync restart, which matters when upgrading the agent on a live site.
  #
  # local_url must name the port the config listens on — startup refuses the
  # pair if they disagree, since nothing would ever reach the server.
  embedded: false
  # embedded_config: /etc/leaf-sync/nats-leaf.conf   # default: <output.dir>/nats-leaf.conf

output:
  dir: .            # where `config` writes nats-leaf.conf + the creds file

sync:
  interval: 30s     # full-reconcile cadence

# Digital-twin sync. Two buckets, one direction each, so no key ever has two
# writers. Off by default because it moves data-plane traffic. Requires
# nats.hub_domain.
#
#   twin          reported state. Written at the edge, relayed up to the hub.
#   twin_desired  desired state. Written by operators at the hub; the edge gets
#                 a JetStream mirror, maintained by the server (no agent in the
#                 data path, and it keeps serving last-known values offline).
#
# Keys are whatever you like — `thing.<code>.<prop>` by convention. Direction is
# the bucket, so no key needs to encode it.
twin:
  enabled: false

# --- Reserved (not yet active in v0) ---------------------------------------
# Optional account-JWT refresh. When enabled, leaf-sync watches the org account
# JWT and runs reload_hook after rewriting resolver_preload. Portable across
# init systems:
#   reload_hook: "systemctl reload nats-server"
#   reload_hook: "docker kill -s HUP nats"
reload_hook: ""
jwt_refresh:
  enabled: false
