# config.yaml
#
# Every key here also has a hardcoded default in main.go's setDefaults(), so the
# binary behaves identically with or without this file. If you add a key, add the
# default too — a key that is read but not defaulted silently becomes the zero
# value, and 0 is a legal-looking but wrong limit.
#
# At-rest encryption (nats.encryption_key / nebula.encryption_key) is OFF by
# default and left empty below. That is a deliberate choice, not an oversight.

tenancy:
  organizations_collection: "organizations"
  memberships_collection: "memberships"
  invites_collection: "invites"
  invite_expiry_days: 7
  log_to_console: false

nats:
  account_collection_name: "nats_accounts"
  user_collection_name: "nats_users"
  role_collection_name: "nats_roles"
  operator_name: "stone-age.io"
  server_url: "nats://localhost:4222"
  # WebSocket listeners the CONSOLE (a browser) should dial. Distinct from
  # server_url above, which is the TCP address this process dials to publish
  # account claims — different port, and behind a proxy or in a container a
  # different hostname too.
  #
  # Served to the SPA at runtime by GET /api/client-config, so changing it needs
  # no frontend rebuild. Empty = the console falls back to ws://localhost:9222,
  # which is what `nats export` generates (websocket { port: 9222, no_tls: true }).
  #
  # Multiple entries are treated by the NATS client as ONE CLUSTER and are
  # shuffled, not tried in order. List peers of the same cluster here; do NOT mix
  # a hub URL with an edge leaf node's URL, since those are different JetStream
  # domains holding different data. Pointing a specific box at a leaf is a
  # per-device override in the console's settings, not a second entry here.
  #
  # A console served over https can only dial wss:// — browsers block ws:// from
  # a secure page outright.
  #
  # Overriding via STONE_AGE_NATS_WEBSOCKET_URLS: separate multiple URLs with
  # SPACES. Viper splits a string env value on whitespace, so commas produce one
  # malformed entry. Startup rejects anything not beginning ws:// or wss://.
  websocket_urls: []
  log_to_console: false
  # Default limits for new organizations
  default_limits:
    max_connections: 10
    max_subscriptions: 50
    max_payload: 1048576
  # Optional AES-256-GCM at-rest encryption for operator/account/user
  # private_key, seed, and signing_keys_private fields. Must be exactly 32
  # characters when set; empty disables encryption. Prefer providing this via
  # env var (STONE_AGE_NATS_ENCRYPTION_KEY) rather than committing the key.
  # Losing the key means losing access to encrypted records.
  encryption_key: ""

nebula:
  ca_collection_name: "nebula_ca"
  network_collection_name: "nebula_networks"
  host_collection_name: "nebula_hosts"
  log_to_console: false
  # Default validity
  default_ca_validity_years: 10
  # Optional AES-256-GCM at-rest encryption for the CA and host private_key
  # columns. Must be exactly 32 characters when set; empty disables encryption.
  # Prefer providing this via env var (STONE_AGE_NEBULA_ENCRYPTION_KEY).
  # Note: the generated config_yaml field still embeds the host key in
  # plaintext (Nebula PKI requires it inline).
  encryption_key: ""

audit:
  collection_name: "audit_logs"
  log_to_console: false
  retention:
    max_age: ""              # Go duration string, e.g. "720h" for 30 days ("" = disabled)
    max_records: 0           # Max records to keep (0 = disabled)
    interval: "0 2 * * *"   # Cron schedule for cleanup

# Operator branding overlay (optional).
# Drop logo.svg, theme.css, and/or branding.json into this directory to override
# the embedded defaults. branding.json shape: { "appName": "...", "logo": "logo.svg" }
# Empty / unset = use embedded defaults.
branding:
  dir: ""
