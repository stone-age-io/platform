# config.yaml
#
# Every key here also has a hardcoded default in main.go's setDefaults(), so the
# binary behaves identically with or without this file. If you add a key, add the
# default too — a key that is read but not defaulted silently becomes the zero
# value, and 0 is a legal-looking but wrong limit.
#
# At-rest encryption (nats.encryption_key / nebula.encryption_key) is OFF by
# default and left empty below. That is a deliberate choice, not an oversight.

tenancy:
  organizations_collection: "organizations"
  memberships_collection: "memberships"
  invites_collection: "invites"
  invite_expiry_days: 7
  # log_to_console is gone: the tenancy hooks are platform code now, and the one
  # thing that flag did was silence invitation-email failures. They go through the
  # application logger unconditionally.

nats:
  account_collection_name: "nats_accounts"
  user_collection_name: "nats_users"
  role_collection_name: "nats_roles"
  operator_name: "stone-age.io"
  server_url: "nats://localhost:4222"
  # WebSocket listeners the CONSOLE (a browser) should dial. Distinct from
  # server_url above, which is the TCP address this process dials to publish
  # account claims — different port, and behind a proxy or in a container a
  # different hostname too.
  #
  # Served to the SPA at runtime by GET /api/client-config, so changing it needs
  # no frontend rebuild. Empty = the console falls back to ws://localhost:9222,
  # which is what `nats export` generates (websocket { port: 9222, no_tls: true }).
  #
  # Multiple entries are treated by the NATS client as ONE CLUSTER and are
  # shuffled, not tried in order. List peers of the same cluster here; do NOT mix
  # a hub URL with an edge leaf node's URL, since those are different JetStream
  # domains holding different data. Pointing a specific box at a leaf is a
  # per-device override in the console's settings, not a second entry here.
  #
  # A console served over https can only dial wss:// — browsers block ws:// from
  # a secure page outright.
  #
  # Overriding via STONE_AGE_NATS_WEBSOCKET_URLS: separate multiple URLs with
  # SPACES. Viper splits a string env value on whitespace, so commas produce one
  # malformed entry. Startup rejects anything not beginning ws:// or wss://.
  websocket_urls: []

  # Where an EDGE box's leaf remote dials this hub, and this hub's own JetStream
  # domain. Both are served to gateways by GET /api/me/leaf-config, which writes
  # them into the generated nats-leaf.conf — so a fleet of edge boxes is told
  # these once, here, rather than each being configured with them by hand at
  # install time.
  #
  # Neither is derived from server_url, for the same reason websocket_urls is
  # not: that is the address THIS process dials to publish account claims. It is
  # a different port (7422 rather than 4222), and behind a proxy or inside a
  # container a different hostname. A Control Plane publishing to
  # nats://nats:4222 says nothing about what an edge box across a WAN can reach.
  #
  # leaf_url empty = no edge box can bootstrap; startup rejects anything not
  # beginning nats-leaf:// or tls://. jetstream_domain is what an edge addresses
  # the hub AS across the link ($JS.<domain>.API), so it must match the
  # `jetstream { domain }` of the hub's own nats-server config.
  leaf_url: ""
  jetstream_domain: "hub"

  log_to_console: false
  # Fair-use ceilings stamped into every new organization's signed account JWT,
  # which is the only place a tenant cannot edit them. Applied at PROVISIONING
  # time only: changing a number here does not reach an account that already
  # exists, which has to be edited on the nats_accounts record.
  #
  # The two storage numbers do different jobs and should not be tuned together.
  # Disk tracks what the plan is sold with. Memory is a blast-radius limit -- a
  # memory-backed stream competes for the RAM every other tenant on the box
  # needs, so it is the one breach not confined to the account that caused it.
  # Keep it small and identical across plans.
  #
  # Connections and subscriptions are headroom, not a fence. Their breach mode
  # is a device that cannot connect or a subscription that quietly fails, so a
  # tight value takes a site offline to save nothing. Set them well above any
  # modelled load and alarm on approach instead. Note clients behind an edge
  # leaf node do NOT count toward max_connections: the hub sees one leaf
  # connection per site, so this counts browsers, the stone CLI, and devices
  # that dial the hub directly.
  #
  # -1 means unlimited. 0 on either JetStream field disables JetStream for the
  # account entirely, taking the digital twin with it -- never use 0 to mean
  # "no limit".
  default_limits:
    max_connections: 100
    max_subscriptions: 5000
    max_payload: 1048576                      # matches nats-server's own default
    max_jetstream_disk_storage: 5368709120    # 5 GiB
    max_jetstream_memory_storage: 67108864    # 64 MiB
  # Optional AES-256-GCM at-rest encryption for operator/account/user
  # private_key, seed, and signing_keys_private fields. Must be exactly 32
  # characters when set; empty disables encryption. Prefer providing this via
  # env var (STONE_AGE_NATS_ENCRYPTION_KEY) rather than committing the key.
  # Losing the key means losing access to encrypted records.
  #
  # Covers the operator seed and the account seeds/signing keys — the material
  # needed to MINT identities. It does not cover creds_file, which contains the
  # user seed by construction and is read straight from the API by the browser
  # to open its own NATS connection. See SECURITY.md for what a stolen database
  # does and does not yield.
  encryption_key: ""

nebula:
  ca_collection_name: "nebula_ca"
  network_collection_name: "nebula_networks"
  host_collection_name: "nebula_hosts"
  log_to_console: false
  # Default validity
  default_ca_validity_years: 10
  # Optional AES-256-GCM at-rest encryption for the CA and host private_key
  # columns. Must be exactly 32 characters when set; empty disables encryption.
  # Prefer providing this via env var (STONE_AGE_NEBULA_ENCRYPTION_KEY).
  # Note: the generated config_yaml field still embeds the host key in
  # plaintext (Nebula PKI requires it inline).
  encryption_key: ""

audit:
  collection_name: "audit_logs"
  log_to_console: false
  retention:
    max_age: ""              # Go duration string, e.g. "720h" for 30 days ("" = disabled)
    max_records: 0           # Max records to keep (0 = disabled)
    interval: "0 2 * * *"   # Cron schedule for cleanup

# Readiness probe (GET /api/ready).
#
# Distinct from PocketBase's /api/health, which reports that the HTTP server is
# listening — true of every failure that matters here. /api/ready answers 503
# while the operator is unseeded, the schema was never imported, or the NATS
# server does not trust this platform's operator. Warnings (at-rest encryption
# off, no browser-facing WebSocket URL) still answer 200: a probe's only lever
# is to restart or de-register, and neither fixes a note.
#
# The checks run on this interval in the background and the endpoint serves the
# cached answer, so a probe never triggers a NATS dial and a slow check shows up
# as a stale `checked` timestamp rather than as an outage. There is no switch to
# turn the endpoint off — one that can be disabled is one that gets disabled and
# then cannot be explained.
#
# Unauthenticated, and the whole body is public — the callers are orchestrators
# and uptime checkers that hold no session, and /metrics already publishes every
# check's state anyway, so withholding the detail here would buy half a boundary
# and a second response shape to maintain. Put it behind a proxy to close it.
readiness:
  interval: 15s
  timeout: 5s

# Prometheus metrics (GET /metrics).
#
# Exposes the readiness checks as a state set, this process's HTTP traffic, row
# counts from its own database, and — only with `serve --nats` — the embedded
# bus's own counters. Nothing per-organization: the Control Plane holds the NATS
# operator and $SYS and has no credential inside any tenant's account, so the
# numbers that would justify a tenant label (which site is offline, which bucket
# is stale) are not visible to it. The agent exports those from the edge, where
# they can actually be seen, and the console asks the bus directly with the
# browser's own in-account credential.
#
# `stone_age_records{collection="things"}` therefore counts devices CONFIGURED.
# It is not an availability metric and an alert on it can never fire.
#
# token: empty means the endpoint is open, which is the default. The series here
# carry no customer identifiers, and an endpoint that needs a credential is one
# that mostly does not get scraped. When set, the same value is accepted as
# `Authorization: Bearer <token>` and as HTTP Basic with any username and the
# token as the password — between them, every scraper in common use. PocketBase's
# own auth is deliberately not used: its tokens expire and no scraper has a
# refresh flow, so it would take a custom sidecar to read a standard format.
metrics:
  enabled: true
  token: ""

# Operator branding overlay (optional).
# Drop logo.svg, theme.css, and/or branding.json into this directory to override
# the embedded defaults. branding.json shape: { "appName": "...", "logo": "logo.svg" }
# Empty / unset = use embedded defaults.
branding:
  dir: ""
